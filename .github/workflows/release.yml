name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build tarball and checksum
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" x86_64
        shell: bash
      - name: Build AppImage and checksum
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool.AppImage" scripts/build-appimage.sh "${GITHUB_REF_NAME#v}" x86_64
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.AppImage dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.AppImage dist/*.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
