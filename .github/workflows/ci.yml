name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Window build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: AppImage
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool.AppImage" scripts/build-appimage.sh 0.0.0-ci x86_64
